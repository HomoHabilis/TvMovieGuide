name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - copilot/add-trending-releases-website

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject TMDB API key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "${TMDB_API_KEY}" ]; then
            echo "::error::TMDB_API_KEY secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          sed -i "s|__TMDB_API_KEY__|${TMDB_API_KEY}|g" js/config.js
          # Verify the placeholder was replaced
          if grep -q '__TMDB_API_KEY__' js/config.js; then
            echo "::error::Placeholder __TMDB_API_KEY__ was not replaced in js/config.js"
            exit 1
          fi
          echo "API key injected successfully (${#TMDB_API_KEY} chars)."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
